[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-delegator"
version = "0.1.0"
description = "Declarative, fail-closed skill delegation CLI"
readme = "README.md"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "jsonschema>=4.23,<5",
    "PyYAML>=6.0,<7",
]

[project.scripts]
skillctl = "skill_delegator.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.superpowers",
    "/var",
]

[tool.hatch.build.targets.wheel]
packages = ["src/skill_delegator"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "skill_delegator/schemas"
"docs" = "skill_delegator/docs"
"config" = "skill_delegator/example/config"
"tests/fixtures/example-source" = "skill_delegator/example/tests/fixtures/example-source"
