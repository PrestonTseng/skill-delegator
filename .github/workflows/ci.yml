          uv run --frozen --python 3.12 skillctl resolve --config config --json > /tmp/skillctl-resolve.json
          set +e
          uv run --frozen --python 3.12 skillctl plan --config config --json > /tmp/skillctl-plan-first.json
          first_plan=$?
          set -e
          test "$first_plan" -eq 1
          uv run --frozen --python 3.12 skillctl apply --config config
          uv run --frozen --python 3.12 skillctl verify --config config
          uv run --frozen --python 3.12 skillctl status --config config --json > /tmp/skillctl-status.json
          python3 -c 'import json; resolved=json.load(open("/tmp/skillctl-resolve.json")); document=json.load(open("/tmp/skillctl-status.json")); summary=document["operation_summary"]; expected=sum(len(target["links"]) for target in resolved["targets"]); assert document["result"] == "converged" and summary["desired_targets"] == len(resolved["targets"]) and summary["desired_links"] == expected and summary["verified_links"] == expected and summary["drift_count"] == 0 and summary["invalid_count"] == 0, document'
          uv run --frozen --python 3.12 skillctl plan --config config --json > /tmp/skillctl-plan-second.json
