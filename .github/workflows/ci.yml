name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Run the full test suite
        run: uv run --frozen --python 3.12 pytest -q
      - name: Check formatting
        run: uv run --frozen --python 3.12 ruff format --check .
      - name: Run Ruff
        run: uv run --frozen --python 3.12 ruff check .
      - name: Compile Python files
        run: uv run --frozen --python 3.12 python -m compileall -q src tests
      - name: Test schema artifacts
        run: uv run --frozen --python 3.12 pytest -q tests/integration/test_schema_artifacts.py
      - name: Build release artifacts
        run: uv build --python 3.12

  macos:
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install uv and Python
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          python-version: "3.12"
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Run the full test suite
        run: uv run --frozen --python 3.12 pytest -q
      - name: Check formatting
        run: uv run --frozen --python 3.12 ruff format --check .
      - name: Run Ruff
        run: uv run --frozen --python 3.12 ruff check .
      - name: Compile Python files
        run: uv run --frozen --python 3.12 python -m compileall -q src tests
      - name: Test schema artifacts
        run: uv run --frozen --python 3.12 pytest -q tests/integration/test_schema_artifacts.py
      - name: Build release artifacts
        run: uv build --python 3.12
