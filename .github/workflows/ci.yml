name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install uv and Python
        uses: astral-sh/setup-uv@557e51de59eb14aaaba2ed9621916900a91d50c6 # v6.6.1
        with:
          python-version: "3.12"
      - name: Prepare the accepted generic engine tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          git diff --exit-code origin/main -- \
            src/skill_delegator tests pyproject.toml uv.lock
          generic_root="$RUNNER_TEMP/skill-delegator-generic"
          mkdir -p "$generic_root"
          git archive origin/main | tar -x -C "$generic_root"
      - name: Install generic locked dependencies
        working-directory: ${{ runner.temp }}/skill-delegator-generic
        run: uv sync --locked --python 3.12
      - name: Run the generic full test suite
        working-directory: ${{ runner.temp }}/skill-delegator-generic
        run: uv run --frozen --python 3.12 pytest -q
      - name: Check generic formatting
        working-directory: ${{ runner.temp }}/skill-delegator-generic
        run: uv run --frozen --python 3.12 ruff format --check .
      - name: Run generic Ruff checks
        working-directory: ${{ runner.temp }}/skill-delegator-generic
        run: uv run --frozen --python 3.12 ruff check .
      - name: Compile generic Python files
        working-directory: ${{ runner.temp }}/skill-delegator-generic
        run: uv run --frozen --python 3.12 python -m compileall -q src tests
      - name: Test generic schema artifacts
        working-directory: ${{ runner.temp }}/skill-delegator-generic
        run: uv run --frozen --python 3.12 pytest -q tests/integration/test_schema_artifacts.py
      - name: Build generic release artifacts
        working-directory: ${{ runner.temp }}/skill-delegator-generic
        run: uv build --python 3.12
      - name: Install authority locked dependencies
        run: uv sync --locked --python 3.12
      - name: Run the authority sandbox workflow
        shell: bash
        run: |
          set -euo pipefail
          uv run --frozen --python 3.12 skillctl lock --config config
          uv run --frozen --python 3.12 skillctl validate --config config
          uv run --frozen --python 3.12 skillctl resolve --config config --json > /tmp/skillctl-resolve.json
          set +e
          uv run --frozen --python 3.12 skillctl plan --config config --json > /tmp/skillctl-plan-first.json
          first_plan=$?
          set -e
          test "$first_plan" -eq 1
          uv run --frozen --python 3.12 skillctl apply --config config
          uv run --frozen --python 3.12 skillctl verify --config config
          uv run --frozen --python 3.12 skillctl status --config config --json > /tmp/skillctl-status.json
          python3 -c 'import json; resolved=json.load(open("/tmp/skillctl-resolve.json")); document=json.load(open("/tmp/skillctl-status.json")); summary=document["operation_summary"]; expected=sum(len(target["links"]) for target in resolved["targets"]); assert document["result"] == "converged" and summary["desired_targets"] == len(resolved["targets"]) and summary["desired_links"] == expected and summary["verified_links"] == expected and summary["drift_count"] == 0 and summary["invalid_count"] == 0, document'
          uv run --frozen --python 3.12 skillctl plan --config config --json > /tmp/skillctl-plan-second.json
          uv run --frozen --python 3.12 skillctl apply --config config > /tmp/skillctl-apply-second.txt
          python3 -c 'from pathlib import Path; assert Path("/tmp/skillctl-apply-second.txt").read_text().strip() == "Already converged"'

  macos-native:
    runs-on: macos-latest
    steps:
